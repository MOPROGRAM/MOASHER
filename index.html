<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مؤشر الفرص</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Prevents theme flicker on page load
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <style>
      body {
        font-family: 'Inter', 'Tajawal', sans-serif;
      }
      @keyframes loading-bar {
        0% {
          left: -100%;
          width: 30%;
        }
        50% {
          left: 100%;
          width: 80%;
        }
        100% {
          left: -100%;
          width: 30%;
        }
      }

      .animate-loading-bar {
        animation: loading-bar 2s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
      }
    </style>

}
</script>
